<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lista de Precios La Giralda</title>
<meta name="description" content="Lista de precios de La Giralda: forrajería, avícola y pet shop. Consultas y pedidos por WhatsApp.">
<meta name="theme-color" content="#003334">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,400..800&display=swap">
<style>html{box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="css">/* Layout: brand band header, sticky search + category chips, one price list grouped by category; editor reuses the same list with inputs */
:root{
  --brand:#003334;--brand-2:#0b4a4b;--lime:#f1f601;--on-lime:#003334;
  --bg:#f3f6f5;--surface:#ffffff;--fg:#0c2526;--muted:#587170;--line:#dbe5e3;--chip:#e6eeec;--warn:#a34a00;--sel:#003334;--sel-fg:#ffffff;
  --display:"Anek Bangla",system-ui,sans-serif;--body:"Anek Bangla",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071516;--surface:#0e2223;--fg:#e4efed;--muted:#8fa9a7;--line:#1e3a3b;--chip:#15302f;--brand-2:#0e5a5b;--warn:#ffb26b;--sel:#f1f601;--sel-fg:#003334;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071516;--surface:#0e2223;--fg:#e4efed;--muted:#8fa9a7;--line:#1e3a3b;--chip:#15302f;--brand-2:#0e5a5b;--warn:#ffb26b;--sel:#f1f601;--sel-fg:#003334;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--brand);color:#fff}
header.band .wrap{padding-block:26px 22px;display:grid;gap:14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:30px;letter-spacing:-.01em;line-height:1}
.logo small{display:block;font-weight:500;font-stretch:110%;font-size:13px;letter-spacing:.06em;color:var(--lime);margin-top:6px;text-transform:uppercase}
h1{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.lime{background:var(--lime);color:var(--on-lime)}
.pill.ghost{background:rgba(255,255,255,.12);color:#fff}
.note{font-size:13px;color:rgba(255,255,255,.78);margin:0}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tools .wrap{padding-block:12px;display:grid;gap:10px}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
.search:focus-visible,.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg)}
main .wrap{padding-block:8px 40px}
section.cat{margin-top:22px}
section.cat h2{font-family:var(--display);font-stretch:115%;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:4px 14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font-weight:600;min-width:0}
.thumb{grid-row:1/span 2;width:56px;height:56px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.thumb img{width:50px;height:50px;object-fit:contain}
.promo{grid-column:2/3;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.promo span{background:var(--lime);color:var(--on-lime);font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.price{grid-row:1/span 2;grid-column:3;font-family:var(--display);font-stretch:110%;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
footer .wrap{padding-block:8px 40px;display:grid;gap:10px;color:var(--muted);font-size:14px}
.wa{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--fg)}
.wa strong{font-family:var(--display);font-stretch:115%;font-size:20px;font-variant-numeric:tabular-nums;user-select:all}
.wa a{margin-left:auto;background:var(--brand);color:#fff;text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.lime{background:var(--lime);color:var(--on-lime)}
.btn.line{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn.dark{background:var(--brand);color:#fff}
.btn.plain{background:var(--chip);color:var(--fg)}
.edit{display:grid;gap:12px}
.edit .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.edit label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.edit input,.edit select{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 10px;min-width:0}
.erow{display:grid;grid-template-columns:1fr 130px 150px auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow input.n{font-weight:600}
.del{background:transparent;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:6px}
.del.armed{color:var(--warn);font-weight:700}
.status{font-size:14px;font-weight:600}
.status.err{color:var(--warn)}
@media (max-width:560px){.erow{grid-template-columns:1fr 1fr;}.erow input.n{grid-column:1/-1}.wa a{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

const DATA=JSON.parse(document.getElementById('data').textContent);
const WA_SHOW='358 4816763', WA_LINK='https://wa.me/5493584816763';
const app=document.getElementById('app');
const fmt=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});

const fdate=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};

let q='',cat='Todos',editing=false;

const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function header(){

  <p class="note">Precios en pesos sujetos a la cotización del dólar. </p>
  </div></header>`;
}
function viewList(){
  const nq=norm(q);
  const vis=DATA.items.filter(i=>(cat==='Todos'||i.c===cat)&&(!nq||norm(i.n).includes(nq)));
  let html='';
  for(const c of cats){
    const rows=vis.filter(i=>i.c===c); if(!rows.length) continue;
    html+=`<section class="cat"><h2>${esc(c)}</h2><div class="list">`+rows.map(i=>`<div class="row"><div class="thumb">${i.i&&DATA.imgs&&DATA.imgs[i.i]?`<img src="${DATA.imgs[i.i]}" alt="" width="50" height="50">`:''}</div><div class="name">${esc(i.n)}</div><div class="price">$ ${fmt.format(ars(i.u))}</div>${i.p?`<div class="promo">${i.p.split('·').map(x=>`<span>${esc(x.trim())}</span>`).join('')}</div>`:''}</div>`).join('')+`</div></section>`;
  }
  if(!html) html=`<div class="empty">No encontramos productos con “${esc(q)}”. Probá con otra palabra o consultanos por WhatsApp.</div>`;
  return html;
}
function render(){
  if(editing){renderEdit();return}

   <div class="chips" role="toolbar" aria-label="Categorías">${['Todos',...cats].map(c=>`<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join('')}</div>
  </div></div><main><div class="wrap" id="list">${viewList()}</div></main>
  <footer><div class="wrap"><div class="wa"><span>Consultas y pedidos por WhatsApp</span><strong>${WA_SHOW}</strong><a href="${WA_LINK}" target="_blank" rel="noopener">Escribinos</a></div>
  <div>Promos por cantidad: por ejemplo, 10+1 es llevando 10 unidades, 1 de regalo. Ventas minoristas y mayoristas.</div></div></footer>`;
  const qi=document.getElementById('q');
  qi.addEventListener('input',e=>{q=e.target.value;document.getElementById('list').innerHTML=viewList()});
  app.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.c;app.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('list').innerHTML=viewList()}));
  const be=document.getElementById('btnEdit'); if(be) be.addEventListener('click',()=>{editing=true;render()});
}
/* ---------- editor (only for people who can edit this page) ---------- */
let draft=null;
function renderEdit(){
  if(!draft) draft={dolar:DATA.dolar,items:DATA.items.map(i=>({c:i.c,n:i.n,a:ars(i.u),p:i.p,i:i.i||''}))};
  app.innerHTML=header()+`<main><div class="wrap edit">
  <div class="bar"><label for="eDolar">Dólar del día ($)<input id="eDolar" type="number" inputmode="decimal" min="1" step="1" value="${draft.dolar}"></label>
   <button class="btn plain" id="btnDolar" type="button">Recalcular todos con este dólar</button></div>
  <p style="margin:0;color:var(--muted);font-size:14px">Los precios se guardan en pesos al dólar que figura arriba. Si cambia el dólar, tocá “Recalcular” y todos los precios se ajustan en la misma proporción.</p>
  ${cats.concat(draft.items.map(i=>i.c).filter(c=>!cats.includes(c))).filter((c,k,a)=>a.indexOf(c)===k).map(c=>{
    const rows=draft.items.map((i,k)=>({i,k})).filter(o=>o.i.c===c); if(!rows.length) return '';
    return `<section class="cat"><h2>${esc(c)}</h2><div class="list">`+rows.map(({i,k})=>`<div class="erow" data-k="${k}">
     <input class="n" id="n${k}" value="${esc(i.n)}" aria-label="Producto">
     <input id="a${k}" type="number" inputmode="decimal" min="0" step="1" value="${i.a}" aria-label="Precio en pesos">
     <input id="p${k}" value="${esc(i.p)}" placeholder="Promo (ej. 10+1 · 20+3)" aria-label="Promo">
     <button class="del" type="button" data-k="${k}">Quitar</button></div>`).join('')+`</div></section>`}).join('')}
  <div class="bar"><label for="newC">Categoría<select id="newC">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>
   <label for="newN" style="flex:1">Producto nuevo<input id="newN" placeholder="Nombre"></label>
   <label for="newA">Precio ($)<input id="newA" type="number" inputmode="decimal" min="0"></label>
   <button class="btn plain" id="btnAdd" type="button">Agregar</button></div>
  <div class="bar"><button class="btn dark" id="btnSave" type="button">Descargar página actualizada</button><button class="btn plain" id="btnCancel" type="button">Cancelar</button><span class="status" id="st" role="status"></span></div>
  </div></main>`;
  const sync=()=>{draft.items.forEach((i,k)=>{const n=document.getElementById('n'+k);if(!n)return;i.n=n.value.trim();i.a=parseFloat(document.getElementById('a'+k).value)||0;i.p=document.getElementById('p'+k).value.trim()});draft.dolar=parseFloat(document.getElementById('eDolar').value)||draft.dolar};
  document.getElementById('btnDolar').onclick=()=>{const old=draft.dolar;sync();const nd=parseFloat(document.getElementById('eDolar').value);if(!(nd>0))return;const f=nd/DATA.dolar;draft.items.forEach(i=>{i.a=Math.round(i.a*(nd/(old||DATA.dolar)))});draft.dolar=nd;renderEdit();document.getElementById('st').textContent='Precios recalculados con dólar $'+fmt.format(nd)+'. Revisá y guardá.'};
  app.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='¿Quitar?';setTimeout(()=>{b.classList.remove('armed');b.textContent='Quitar'},3000);return}sync();draft.items.splice(+b.dataset.k,1);renderEdit()});
  document.getElementById('btnAdd').onclick=()=>{sync();const n=document.getElementById('newN').value.trim();if(!n)return;draft.items.push({c:document.getElementById('newC').value,n,a:parseFloat(document.getElementById('newA').value)||0,p:'',i:''});renderEdit()};
  document.getElementById('btnCancel').onclick=()=>{draft=null;editing=false;render()};
  document.getElementById('btnSave').onclick=()=>{sync();const st=document.getElementById('st');
    const d=new Date();const today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const next={dolar:draft.dolar,fecha:today,imgs:DATA.imgs||{},items:draft.items.filter(i=>i.n).map(i=>({c:i.c,n:i.n,u:+(i.a/draft.dolar).toFixed(6),p:i.p,i:i.i||''}))};
    const blob=new Blob([buildDoc(next)],{type:'text/html'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    st.className='status';st.textContent='Listo: se descargó index.html. Subilo al sitio reemplazando el anterior.'};
}
function buildDoc(data){
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  const tpl=document.documentElement.outerHTML;
  const html=tpl.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b)
    .replace(/<div id="app">[\s\S]*?<\/div>(?=<script type="application\/json")/,'<div id="app"></div>');
  return '<!doctype html>\n'+html;
}
render();
window.addEventListener('hashchange',()=>location.reload());
})();
</script>
